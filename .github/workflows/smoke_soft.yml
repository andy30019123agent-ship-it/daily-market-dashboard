# 軟情報（OpenAI 上網查新聞）連線煙霧測試。
# 只手動觸發、不推播 Telegram、不部署、不 commit 回 main。
# 用途：本機沒有可用的 OPENAI_API_KEY，改動 gen_soft_openai.py 後在雲端拿真證據。
name: 煙霧測試（軟情報）

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓硬數據（產生 partial 供軟情報使用）
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
        run: python scripts/fetch_hard_data.py

      - name: 診斷：比較「自由文字」與「強制 JSON 格式」兩種請求
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/_diag_json_mode.py
